name: spelling

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spelling:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::spelling
      - name: Check spelling against the reviewed word list
        shell: Rscript {0}
        run: |
          errors <- spelling::spell_check_package()
          print(errors)
          if (nrow(errors)) stop("Review the spelling findings before updating inst/WORDLIST")
